name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      # The gate and its test need nothing beyond the standard library, so
      # they run on the runner's own python: this repository is shell, and a
      # python project around it would be machinery without an owner.
      - name: Check the repository root layout
        run: python3 scripts/check_root_layout.py
      - name: Run the tests under scripts/
        run: python3 -m unittest discover --start-directory scripts --pattern 'test_*.py' --verbose
      # failglob turns a pattern that matches nothing into a loud failure: a
      # loop that silently checks no files would report green while a command
      # under bin/ had lost its executable bit, and the autostart entry would
      # simply stop recovering sessions.
      - name: Check the shell scripts parse and stay executable
        run: |
          shopt -s failglob
          for script in bin/* scripts/*.sh; do
            bash -n "$script"
            test -x "$script" || { echo "$script is not executable"; exit 1; }
          done
