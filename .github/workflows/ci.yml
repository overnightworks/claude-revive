name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # A fork's pull request receives none of this repository's secrets, so the
    # findings gate below arms itself on the credential it needs rather than on
    # a guess about the event that started the run.
    env:
      SONAR_ENABLED: ${{ secrets.SONAR_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      # These checks need nothing beyond the standard library, so they run on
      # the runner's own python: this repository is shell, and a python project
      # around it would be machinery without an owner.
      - name: Check the repository root layout
        run: python3 scripts/check_root_layout.py
      - name: Run the tests under scripts/
        run: python3 -m unittest discover --start-directory scripts --pattern 'test_*.py' --verbose
      # failglob turns a pattern that matches nothing into a loud failure: a
      # loop that silently checks no files would report green while a command
      # under bin/ had lost its executable bit, and the autostart entry would
      # simply stop recovering sessions.
      - name: Check the shell scripts parse and stay executable
        run: |
          shopt -s failglob
          for script in bin/* scripts/*.sh; do
            bash -n "$script"
            test -x "$script" || { echo "$script is not executable"; exit 1; }
          done
      # Unguarded on purpose: a green run must say whether it asserted the
      # findings or deliberately skipped, because a step that is silently
      # conditioned away reads as a proof it never produced.
      - name: Report the skip when no SONAR_TOKEN reaches this run
        if: ${{ env.SONAR_ENABLED != 'true' }}
        run: >-
          echo "::notice::SonarCloud open findings skipped: this run receives no
          SONAR_TOKEN, as a fork's pull request gets none of this repository's
          secrets, so the findings were never read. The code is checked against
          SonarCloud once it runs from a branch in this repository."
      # SonarCloud analyses this project itself and grades it against a quality
      # gate of ratings, which a finding accepted or marked false positive in
      # its web interface leaves entirely; the interface is never the place to
      # silence a finding. So this step asks the API for the open findings of
      # this exact scope and fails with the list. How it asks -- the encoded
      # scope, the proof that the scope resolves before a zero reads as clean,
      # the credential that never leaves a header -- is owned by the fleet's
      # action, which this repository consumes instead of copying. It reads
      # this repository's own sonar-project.properties from the workspace, so
      # the project it asks about is this one. The reference is pinned to a
      # commit: a tag or a branch on a step guarding security findings is a
      # supply-chain hole and a silent change to what the gate asserts.
      - name: SonarCloud open findings
        if: ${{ env.SONAR_ENABLED == 'true' }}
        # The action bounds each call; this is the hard ceiling, because it
        # pages and a per-call bound multiplies. A composite action's inner
        # steps take no timeout-minutes, so the ceiling belongs to this step.
        timeout-minutes: 5
        uses: overnightworks/marketplace/.github/actions/sonar-findings-gate@85b0e13e0530ed12b5a81208681015eda6f7854b # sonar-findings-gate-v1
        with:
          sonar-token: ${{ secrets.SONAR_TOKEN }}
